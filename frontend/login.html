<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ReviewLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <div class="navbar">
        <div class="container">
            <a class="brand" href="explore.html">
                <span aria-hidden="true">★</span>
                <span>ReviewLink</span>
            </a>

            <div class="nav-right">
                <button class="btn btn-sm" type="button" onclick="RL.toggleTheme()">Тема</button>
                <a class="btn btn-sm btn-link" href="explore.html">Главная</a>
            </div>
        </div>
    </div>

    <div class="auth-shell">
        <div class="card auth-card">
            <div class="auth-title">Авторизация</div>

            <form id="loginForm" class="stack">
                <div>
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" placeholder="ваш@email.com" required>
                </div>

                <div>
                    <label for="passwordInput">Пароль</label>
                    <input type="password" id="passwordInput" placeholder="Введите пароль" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-box-arrow-in-right"></i>Войти
                </button>

                <div id="loginMessage"></div>
            </form>
        </div>
    </div>


    <script src="common.js"></script>
    <script src="login.js"></script>
</body>

</html>
