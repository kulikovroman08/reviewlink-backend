<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Оставить отзыв — ReviewLink</title>

    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>

<body>
<nav class="navbar">
    <div class="container">
        <a class="brand" href="explore.html">
            ReviewLink
        </a>

        <div class="nav-right">
            <button class="btn btn-sm" id="themeBtn" type="button" title="Сменить тему">Тема</button>

            <!-- ✅ исправлено: личный кабинет должен вести в dashboard -->
            <a class="btn btn-sm" href="dashboard.html">
                <i class="bi bi-house"></i> Личный кабинет
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="page-title center">Оставить отзыв</h1>
    <p class="muted center" style="margin-top:-14px; margin-bottom: var(--space-5);">
        Поставьте оценку и напишите комментарий
    </p>

    <div class="card" style="max-width: 640px; margin: 0 auto;">
        <div class="card-header">
            <h5 class="section-title">
                <i class="bi bi-chat-heart"></i> Форма отзыва
            </h5>
        </div>

        <div class="card-body">
            <div id="modeBadge" class="muted center" style="margin-bottom: 10px;"></div>

            <!-- ✅ добавлено: показываем название заведения (для public place / каталога) -->
            <div id="placeName" class="muted center small" style="margin-bottom: 14px;"></div>

            <div class="stack">
                <div>
                    <div class="muted" style="margin-bottom: 8px;">Оценка</div>
                    <div id="ratingStars" class="rating-stars"></div>
                </div>

                <div>
                    <label class="muted" for="reviewContent">Комментарий (необязательно)</label>
                    <textarea id="reviewContent" rows="4" placeholder="Поделитесь впечатлениями..."></textarea>
                </div>

                <div id="formMessage"></div>

                <button id="submitBtn" class="btn btn-success btn-lg" type="button">
                    <i class="bi bi-send"></i> Отправить отзыв
                </button>
            </div>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script src="review-form.js"></script>
</body>
</html>
