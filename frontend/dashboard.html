<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - ReviewLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a class="brand" href="explore.html">
                ReviewLink
            </a>

            <div class="nav-right">
                <span id="userEmail" class="muted"></span>

                <button class="btn btn-sm" id="themeBtn" type="button" title="Сменить тему">
                    Тема
                </button>

                <button class="btn btn-sm" id="logoutBtn" type="button">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="page-title center">Личный кабинет</h1>
        <p class="muted center" style="margin-top: -14px; margin-bottom: var(--space-5);">
            Управление бонусами и статистикой
        </p>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-tile">
                <div class="icon"><i class="bi bi-chat-text"></i></div>
                <div class="label">Всего отзывов</div>
                <div class="value" id="totalReviews">0</div>
            </div>

            <div class="stat-tile">
                <div class="icon"><i class="bi bi-star"></i></div>
                <div class="label">Средний рейтинг</div>
                <div class="value" id="avgRating">0.0</div>
            </div>

            <div class="stat-tile">
                <div class="icon"><i class="bi bi-coin"></i></div>
                <div class="label">Баллы</div>
                <div class="value" id="points">0</div>
            </div>

            <div class="stat-tile">
                <div class="icon"><i class="bi bi-gift"></i></div>
                <div class="label">Активные бонусы</div>
                <div class="value" id="bonusesActive">0</div>
            </div>
        </div>

        <div class="stack">
            <!-- Обмен баллов -->
            <div class="card">
                <div class="card-header">
                    <h5 class="section-title">
                        <i class="bi bi-arrow-repeat"></i> Обмен баллов на бонус
                    </h5>
                </div>

                <div class="card-body">
                    <div class="form-row">
                        <div>
                            <div class="muted">Ваши баллы</div>
                            <div class="value"><span id="currentPoints">0</span></div>

                            <div class="mt-3">
                                <label for="rewardType">Тип бонуса</label>
                                <select id="rewardType">
                                    <option value="free_coffee">Бесплатный кофе</option>
                                    <option value="free_meal">Бесплатное блюдо</option>
                                    <option value="discount_10">Скидка 10%</option>
                                </select>
                                <div class="help">Для получения бонуса нужно 50 баллов</div>
                            </div>
                        </div>

                        <div class="center">
                            <button id="redeemBtn" class="btn btn-success btn-lg" disabled>
                                <i class="bi bi-gift"></i> Получить бонус
                            </button>
                            <div id="redeemMessage" class="mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Мои бонусы -->
            <h3 class="section-title" style="font-size:22px; margin: var(--space-5) 0 var(--space-3);">
                <i class="bi bi-gift-fill"></i> Мои бонусы
            </h3>

            <div class="bonuses-grid">
                <div class="card">
                    <div class="card-header">
                        <span class="section-title"><i class="bi bi-stars"></i> Активные бонусы</span>
                    </div>
                    <div class="card-body" id="activeBonuses">
                        <div class="center subtle" style="padding: var(--space-5);">
                            Загрузка...
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="section-title"><i class="bi bi-clock-history"></i> Использованные бонусы</span>
                    </div>
                    <div class="card-body" id="usedBonuses">
                        <div class="center subtle" style="padding: var(--space-5);">
                            Загрузка...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для QR кода -->
    <div class="modal rl-modal" id="qrModal" tabindex="-1" aria-hidden="true">
        <div class="rl-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
            <div class="rl-modal__content">
                <div class="rl-modal__header">
                    <h5 class="rl-modal__title" id="qrModalTitle">QR код бонуса</h5>
                    <button type="button" class="rl-modal__close" aria-label="Закрыть">×</button>
                </div>

                <div class="rl-modal__body">
                    <img id="qrCodeImage" src="" alt="QR Code" class="rl-modal__qr">
                    <p id="bonusDescription" class="subtle" style="margin-top: var(--space-3); font-size: 13px;"></p>
                    <div id="bonusTokenWrap" class="badge"
                        style="margin-top: var(--space-3); max-width:100%; overflow:hidden; text-overflow:ellipsis;">
                        <span class="muted" style="font-size:12px;">Код:</span>
                        <span id="bonusToken" style="font-size:12px;"></span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
