<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ReviewLink — Публичная страница</title>

    <link rel="stylesheet" href="style.css"/>

    <!-- Leaflet -->
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body>
<div class="topbar">
    <div class="container">
        <a class="brand" href="explore.html">
            <span style="font-size:18px;">⭐</span>
            <span>ReviewLink</span>
        </a>

        <div class="nav-right">
            <span id="authPill" class="badge">Гость</span>

            <button class="btn btn-sm" type="button"
                    onclick="window.RL && window.RL.toggleTheme && window.RL.toggleTheme()">
                Тема
            </button>

            <a class="btn btn-sm" href="login.html">Войти</a>
            <a class="btn btn-primary btn-sm" href="dashboard.html">Личный кабинет</a>
        </div>
    </div>
</div>

<main class="container">
    <h1 class="page-title">Публичная страница</h1>

    <!-- ОДНА ПЛАШКА УПРАВЛЕНИЯ -->
    <div class="card" style="margin-bottom: var(--space-4);">
        <div class="card-body stack">
            <div class="form-row">
                <div style="flex: 1;">
                    <label>Раздел</label>
                    <select id="modeSelect">
                        <option value="places">Лидеры — Заведения</option>
                        <option value="users">Лидеры — Пользователи</option>
                        <option value="bonuses">Лидеры — Бонусы</option>
                        <option value="catalog">Каталог заведений</option>
                    </select>
                    <div class="help subtle" id="modeHint"></div>
                </div>

                <div class="right row" style="align-items:flex-end;">
                    <button id="refreshTopBtn" class="btn btn-sm" type="button">Обновить</button>
                </div>
            </div>

            <!-- ФИЛЬТРЫ КАТАЛОГА -->
            <div id="catalogFilters" class="d-none">
                <div class="form-row">
                    <div style="flex: 1;">
                        <label>Поиск (search)</label>
                        <input id="searchInput" type="text" placeholder="Напр. Паста|Пицца"/>
                        <div class="help subtle">По имени (regex строка как в swagger)</div>
                    </div>

                    <div style="flex: 1;">
                        <label>Amenity (amenity)</label>
                        <input id="amenityInput" type="text" placeholder="cafe|restaurant"/>
                        <div class="help subtle">Фильтр по amenity (regex строка)</div>
                    </div>

                    <div style="width: 160px;">
                        <label>Лимит</label>
                        <input id="limitInput" type="number" min="1" max="200" value="50"/>
                        <div class="help subtle">От 1 до 200</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOP LISTS / CATALOG -->
    <section id="topView" class="card">
        <div class="card-header">
            <div>
                <div class="section-title">Список</div>
                <div id="topStatus" class="muted small">Загрузка...</div>
            </div>
        </div>

        <div class="card-body stack">
            <div id="map"
                 class="d-none"
                 style="height:420px;width:100%;border-radius:16px;margin-bottom:16px">
            </div>

            <div id="topContainer" class="stack"></div>
        </div>
    </section>

    <!-- PLACE REVIEWS -->
    <section id="placeView" class="d-none">
        <div class="row" style="margin: var(--space-5) 0;">
            <button id="backToTopBtn" class="btn btn-sm" type="button">← Назад</button>

            <div class="right row">
                <button
                        id="leaveReviewBtn"
                        class="btn btn-success btn-sm d-none"
                        type="button"
                >
                    ⭐ Оставить отзыв
                </button>
                <button id="refreshReviewsBtn" class="btn btn-sm" type="button">Обновить отзывы</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div id="placeTitle" class="section-title">Отзывы заведения</div>
                </div>
                <div id="reviewsStatus" class="muted small">Загрузка...</div>
            </div>

            <div class="card-body stack">
                <div class="form-row">
                    <div>
                        <label>Сортировка</label>
                        <select id="sortSelect">
                            <option value="date_desc">Сначала новые</option>
                            <option value="date_asc">Сначала старые</option>
                        </select>
                    </div>

                    <div>
                        <label>Фильтр по рейтингу</label>
                        <select id="ratingSelect">
                            <option value="">Все</option>
                            <option value="5">5</option>
                            <option value="4">4</option>
                            <option value="3">3</option>
                            <option value="2">2</option>
                            <option value="1">1</option>
                        </select>
                    </div>
                </div>

                <div id="voteHint" class="help subtle"></div>

                <div id="reviewsContainer" class="stack"></div>
            </div>
        </div>
    </section>
</main>

<script src="common.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="explore.js"></script>
</body>
</html>
