<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ReviewLink</title>

    <link rel="stylesheet" href="style.css"/>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>

<body>
<div class="topbar">
    <div class="container">
        <a class="brand" href="explore.html">
            <span style="font-size:18px;">⭐</span>
            <span>ReviewLink</span>
        </a>

        <div class="nav-right">
            <span id="authPill" class="badge">Гость</span>

            <button class="btn btn-sm" type="button"
                    onclick="window.RL && window.RL.toggleTheme && window.RL.toggleTheme()">
                Тема
            </button>

            <a class="btn btn-sm" href="login.html">Войти</a>
            <a class="btn btn-primary btn-sm" href="dashboard.html">Личный кабинет</a>
        </div>
    </div>
</div>

<!-- ===== NEWS (TOP STRIP, directly under topbar) ===== -->
<div class="container" style="margin-top: var(--space-4);">
    <section id="newsSection" class="card" style="margin-bottom: var(--space-4);">
        <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;">
            <div>
                <div class="section-title">Новости</div>
                <div class="muted small">Afisha Daily</div>
            </div>
            <button id="newsRefreshBtn" class="btn btn-sm" type="button">Обновить</button>
        </div>

        <div class="card-body" style="padding-top:10px;">
            <div id="newsRow" class="newsRow">
                <!-- cards injected -->
            </div>

            <div id="newsEmpty" class="muted small" style="display:none; padding:8px 0;">
                Пока нет новостей.
            </div>
        </div>
    </section>
</div>

<style>
    /* top strip row: cards fit within container, never overflow */
    .newsRow{
        display:grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap:10px;
    }
    @media (max-width: 1200px){
        .newsRow{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 900px){
        .newsRow{
            grid-auto-flow: column;
            grid-auto-columns: minmax(260px, 1fr);
            grid-template-columns: none;
            overflow-x: auto;
            padding-bottom: 4px;
            scroll-snap-type: x mandatory;
        }
        .newsRow::-webkit-scrollbar{ height: 8px; }
        .newsRow::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.12); border-radius: 8px; }
        .newsCard{ scroll-snap-align: start; }
    }

    .newsCard{
        background: rgba(255,255,255,.03);
        border: 1px solid rgba(255,255,255,.06);
        border-radius: 16px;
        padding: 12px;
        min-height: 90px;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        gap:10px;
    }
    .newsTitle{
        font-size: 13px;
        line-height: 1.35;
        font-weight: 600;
        color: rgba(255,255,255,.92);
        text-decoration:none;
        display:-webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow:hidden;
    }
    .newsTitle:hover{ text-decoration: underline; }
    .newsMeta{
        display:flex;
        justify-content:space-between;
        gap:10px;
        font-size:12px;
        opacity:.7;
        white-space: nowrap;
    }
</style>

<main class="container">

    <!-- ОДНА ПЛАШКА УПРАВЛЕНИЯ -->
    <div class="card" style="margin-bottom: var(--space-4);">
        <div class="card-body stack">

            <!-- ===== Главные вкладки: Каталог / Лидеры ===== -->
            <div class="form-row" style="align-items:flex-end;">
                <div style="flex:1;">
                    <label>Раздел</label>

                    <div class="row" style="gap:8px; flex-wrap:wrap;">
                        <button id="tabCatalogBtn" type="button" class="btn btn-sm btn-primary">
                            Каталог заведений
                        </button>
                        <button id="tabLeadersBtn" type="button" class="btn btn-sm">
                            Лидеры
                        </button>
                    </div>

                    <div class="help subtle" id="modeHint"></div>

                    <select id="modeSelect" class="d-none">
                        <option value="catalog">Каталог заведений</option>
                        <option value="places">Лидеры — Заведения</option>
                        <option value="users">Лидеры — Пользователи</option>
                        <option value="bonuses">Лидеры — Бонусы</option>
                    </select>
                </div>

                <div class="right row" style="align-items:flex-end;">
                    <button id="refreshTopBtn" class="btn btn-sm" type="button">Обновить список</button>
                </div>
            </div>

            <!-- ===== Подвкладки лидеров ===== -->
            <div id="leadersTabs" class="row d-none" style="gap:8px; flex-wrap:wrap;">
                <button id="leadersPlacesBtn" type="button" class="btn btn-sm btn-primary">Заведения</button>
                <button id="leadersUsersBtn" type="button" class="btn btn-sm">Пользователи</button>
                <button id="leadersBonusesBtn" type="button" class="btn btn-sm">Бонусы</button>
            </div>

            <!-- ФИЛЬТРЫ КАТАЛОГА -->
            <div id="catalogFilters" class="d-none">
                <div class="form-row">
                    <div style="flex: 1;">
                        <label>Поиск</label>
                        <input id="searchInput" type="text" placeholder="Напр. Седьмой континент"/>
                        <div class="help subtle">По названию заведения</div>
                    </div>

                    <div style="flex: 1;">
                        <label>Тип заведения</label>
                        <select id="amenityInput">
                            <option value="">Все</option>
                            <option value="restaurant">Ресторан</option>
                            <option value="cafe">Кафе</option>
                            <option value="coffee_shop">Кофейня</option>
                            <option value="bar">Бар</option>
                            <option value="pub">Паб</option>
                            <option value="fast_food">Фастфуд</option>
                            <option value="canteen">Столовая</option>
                            <option value="nightclub">Клуб</option>
                        </select>
                        <div class="help subtle">Выберите тип заведения</div>
                    </div>

                    <div style="width: 160px;">
                        <label>Лимит</label>
                        <input id="limitInput" type="number" min="1" max="200" value="50"/>
                        <div class="help subtle">От 1 до 200</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- TOP LISTS / CATALOG -->
    <section id="topView" class="card">
        <div class="card-header">
            <div>
                <div class="section-title">Список</div>
                <div id="topStatus" class="muted small">Загрузка...</div>
            </div>
        </div>

        <div class="card-body stack">
            <div id="map"
                 class="d-none"
                 style="height:420px;width:100%;border-radius:16px;margin-bottom:16px">
            </div>

            <div id="topContainer" class="stack"></div>
        </div>
    </section>

    <!-- PLACE REVIEWS -->
    <section id="placeView" class="d-none">
        <div class="row" style="margin: var(--space-5) 0;">
            <button id="backToTopBtn" class="btn btn-sm" type="button">← Назад</button>

            <div class="right row">
                <button
                        id="leaveReviewBtn"
                        class="btn btn-success btn-sm d-none"
                        type="button"
                >
                    ⭐ Оставить отзыв
                </button>
                <button id="refreshReviewsBtn" class="btn btn-sm" type="button">Обновить отзывы</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div id="placeTitle" class="section-title">Отзывы заведения</div>
                </div>
                <div id="reviewsStatus" class="muted small">Загрузка...</div>
            </div>

            <div class="card-body stack">
                <div class="form-row">
                    <div>
                        <label>Сортировка</label>
                        <select id="sortSelect">
                            <option value="date_desc">Сначала новые</option>
                            <option value="date_asc">Сначала старые</option>
                        </select>
                    </div>

                    <div>
                        <label>Фильтр по рейтингу</label>
                        <select id="ratingSelect">
                            <option value="">Все</option>
                            <option value="5">5</option>
                            <option value="4">4</option>
                            <option value="3">3</option>
                            <option value="2">2</option>
                            <option value="1">1</option>
                        </select>
                    </div>
                </div>

                <div id="voteHint" class="help subtle"></div>

                <div id="reviewsContainer" class="stack"></div>
            </div>
        </div>
    </section>

    <!-- Лёгкий inline-скрипт для табов -->
    <script>
		document.addEventListener("DOMContentLoaded", () => {
			const modeSelect = document.getElementById("modeSelect");
			const catalogFilters = document.getElementById("catalogFilters");
			const leadersTabs = document.getElementById("leadersTabs");

			const tabCatalogBtn = document.getElementById("tabCatalogBtn");
			const tabLeadersBtn = document.getElementById("tabLeadersBtn");

			const leadersPlacesBtn = document.getElementById("leadersPlacesBtn");
			const leadersUsersBtn = document.getElementById("leadersUsersBtn");
			const leadersBonusesBtn = document.getElementById("leadersBonusesBtn");

			function setActiveButton(btn, active) {
				if (!btn) return;
				btn.classList.toggle("btn-primary", !!active);
			}

			function setMainTab(tab) {
				const isCatalog = tab === "catalog";

				setActiveButton(tabCatalogBtn, isCatalog);
				setActiveButton(tabLeadersBtn, !isCatalog);

				if (leadersTabs) leadersTabs.classList.toggle("d-none", isCatalog);
				if (catalogFilters) catalogFilters.classList.toggle("d-none", !isCatalog);

				if (!modeSelect) return;
				modeSelect.value = isCatalog ? "catalog" : (modeSelect.value === "catalog" ? "places" : modeSelect.value);
				modeSelect.dispatchEvent(new Event("change"));
			}

			function setLeadersSubTab(val) {
				setActiveButton(leadersPlacesBtn, val === "places");
				setActiveButton(leadersUsersBtn, val === "users");
				setActiveButton(leadersBonusesBtn, val === "bonuses");

				if (!modeSelect) return;
				modeSelect.value = val;
				modeSelect.dispatchEvent(new Event("change"));
			}

			tabCatalogBtn?.addEventListener("click", () => setMainTab("catalog"));
			tabLeadersBtn?.addEventListener("click", () => setMainTab("leaders"));

			leadersPlacesBtn?.addEventListener("click", () => setLeadersSubTab("places"));
			leadersUsersBtn?.addEventListener("click", () => setLeadersSubTab("users"));
			leadersBonusesBtn?.addEventListener("click", () => setLeadersSubTab("bonuses"));

			const initial = modeSelect?.value || "places";
			if (initial === "catalog") {
				setMainTab("catalog");
			} else {
				setMainTab("leaders");
				setLeadersSubTab(initial);
			}
		});
    </script>

</main>

<script src="common.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="explore.js"></script>
<script src="news.js"></script>
</body>
</html>
